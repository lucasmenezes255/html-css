<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados LOCALMENTE</h1>
    <p>
        Esse vídeo está hospedado no meu próprio servidor
    </p>
    <video width="250" poster="./images/spiral-page.jpg" controls loop>
        <source src="./media/myvideo_1920_1080_30fps.mp4" type="video/mp4">
        <source src="./media/myvideo_1920_1080_30fps.mkv" type="video/mkv">
    </video>
    <h1>Inserindo vídeos externos</h1>
    <p>
        Esse vídeo é do YouTube
    </p>
    
    <iframe width="500" height="317" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=j9fBmwJkcdAv3ZGP" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


</body>
</html>
